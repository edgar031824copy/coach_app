<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form view · C</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="top"><h1 class="brand">Hybrid Coach</h1><a class="weeklabel" href="plan.html">My plan</a></header><main><h2 style="font:900 28px var(--display);margin-bottom:16px">New plan</h2><form onsubmit="return false"><div class="field"><label for="goal">Goal</label><textarea id="goal" aria-describedby="e-goal" aria-invalid="true"></textarea><p class="err" id="e-goal">Enter a goal, for example “run a half marathon”.</p></div><div class="field"><label for="rl">Running level</label><select id="rl"><option>Choose…</option><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div><div class="field"><label for="cl">CrossFit level</label><select id="cl"><option>Choose…</option><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div><div class="field"><label for="inj">Injuries or pain</label><textarea id="inj"></textarea><small>Leave empty if none.</small></div><fieldset><legend>Running days</legend><div class="days-pick"><label><input type="checkbox" name="r" ><span>Mon</span></label><label><input type="checkbox" name="r" checked><span>Tue</span></label><label><input type="checkbox" name="r" checked><span>Wed</span></label><label><input type="checkbox" name="r" ><span>Thu</span></label><label><input type="checkbox" name="r" ><span>Fri</span></label><label><input type="checkbox" name="r" checked><span>Sat</span></label><label><input type="checkbox" name="r" ><span>Sun</span></label></div></fieldset><fieldset><legend>CrossFit days</legend><div class="days-pick"><label><input type="checkbox" name="c" checked><span>Mon</span></label><label><input type="checkbox" name="c" checked><span>Tue</span></label><label><input type="checkbox" name="c" checked><span>Wed</span></label><label><input type="checkbox" name="c" checked><span>Thu</span></label><label><input type="checkbox" name="c" checked><span>Fri</span></label><label><input type="checkbox" name="c" ><span>Sat</span></label><label><input type="checkbox" name="c" ><span>Sun</span></label></div></fieldset><div class="field"><label for="paste">Your running plan</label><textarea id="paste"></textarea><small>Optional. Paste it and the coach keeps your sessions.</small></div><fieldset><legend>Your usual week (optional)</legend><div class="field"><label for="n1">Running sessions per week</label><input id="n1" type="number" value="3"></div><div class="field"><label for="n2">CrossFit sessions per week</label><input id="n2" type="number" value="5"></div><div class="field"><label for="n3">Running km per week</label><input id="n3" type="number" value="25"></div></fieldset><fieldset><legend>Target event (optional)</legend><div class="field"><label for="ev">Event name</label><input id="ev" type="text"></div><div class="field"><label for="ed">Event date</label><input id="ed" type="date"></div></fieldset><div class="actions"><button class="btn" type="submit">Build my plan</button><a class="btn quiet" href="plan.html">My plan</a></div></form></main></div></body></html>
